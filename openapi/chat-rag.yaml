openapi: 3.0.3
info:
  title: Vecinita ChatRAG API
  version: 0.2.0
  description: Bilingual community Q&A and public corpus browse (stateless; no identity fields).
servers:
  - url: https://{host}/api/v1
    description: ChatRAG backend (DigitalOcean)
    variables:
      host:
        default: localhost
        description: API host (override per environment)
# Public community API — no authentication required (explicit empty security).
security: []
paths:
  /ask:
    post:
      operationId: ask
      summary: Non-streaming bilingual Q&A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Answer with retrieval sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /ask/stream:
    post:
      operationId: askStream
      summary: Streaming answer (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: >
            Server-sent events (`token`, `sources`, `done`).
            The `done` event may include `cache_hit` (`none` | `exact` | `semantic` | `retrieve`) when F43 is enabled.
            The `done` event includes `energy_estimate` (F65 / EV-024).
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /documents:
    get:
      operationId: listDocumentsPublic
      summary: Browse corpus documents (public)
      parameters:
        - name: tags
          in: query
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          style: form
          explode: true
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBrowsePage"
  /documents/{document_id}:
    get:
      operationId: getDocumentPublic
      summary: Document detail for browse
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document metadata and tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBrowseDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /tags:
    get:
      operationId: listTagsPublic
      summary: Tag facets for browse and chat filters
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
  /health:
    get:
      operationId: health
      summary: Service health
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /feedback:
    post:
      operationId: createFeedback
      summary: Submit anonymous community feedback (F68 / ADR-046)
      description: >
        Proxies to internal-write. Rejects email/identity fields (AC-UX11).
        No visitor email or user_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "201":
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackCreateResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  # Documented for OpenAPI completeness; ChatRAG remains public (security: []).
  securitySchemes:
    publicUnauthenticated:
      type: http
      scheme: bearer
      bearerFormat: unused
      description: >
        Placeholder scheme only — this API does not require credentials.
        Global security is an empty array.
  schemas:
    AskRequest:
      type: object
      additionalProperties: false
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
        language:
          type: string
          enum:
            - en
            - es
          description: >
            Corpus language filter and response language. When omitted, the backend
            auto-detects from the question text (ADR-013).
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 64
    TagSummary:
      type: object
      required:
        - slug
        - label
      properties:
        slug:
          type: string
        label:
          type: string
    DocumentBrowseItem:
      type: object
      required:
        - document_id
        - url
        - tags
      properties:
        document_id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        url:
          type: string
        language:
          type: string
          nullable: true
        source_domain:
          type: string
          nullable: true
          description: Nested source domain (F61)
        source_path:
          type: string
          nullable: true
        parent_url:
          type: string
          nullable: true
        canonical_url:
          type: string
          nullable: true
        tags:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TagSummary"
    DocumentBrowsePage:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/DocumentBrowseItem"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    DocumentBrowseDetail:
      allOf:
        - $ref: "#/components/schemas/DocumentBrowseItem"
    TagFacet:
      type: object
      required:
        - slug
        - label
        - language
        - document_count
      properties:
        slug:
          type: string
        label:
          type: string
        language:
          type: string
        document_count:
          type: integer
          minimum: 0
    TagListResponse:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TagFacet"
    Source:
      type: object
      required:
        - chunk_id
        - document_id
        - score
      properties:
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        score:
          type: number
          format: float
        source_domain:
          type: string
          nullable: true
          description: Nested source domain (F61)
        source_path:
          type: string
          nullable: true
        parent_url:
          type: string
          nullable: true
        canonical_url:
          type: string
          nullable: true
    EnergyEstimate:
      type: object
      description: >
        F65 heuristic Wh/gCO₂e from GPU TDP × util × ask wall time (ADR-047).
        Not live Modal power metrics. `car_*_equiv` from g_co2e ÷ car g/km.
      required:
        - wh
        - g_co2e
        - method
        - advisory
        - car_km_equiv
        - car_m_equiv
      properties:
        wh:
          type: number
        g_co2e:
          type: number
        method:
          type: string
          enum:
            - tdp_util_walltime_v1
        advisory:
          type: string
        car_km_equiv:
          type: number
        car_m_equiv:
          type: number
    FeedbackRequest:
      type: object
      description: Anonymous feedback body (F68 / ADR-046) — no email or identity fields.
      additionalProperties: false
      required:
        - category
        - message
      properties:
        category:
          type: string
          enum:
            - bug
            - wrong_answer
            - suggestion
            - other
        message:
          type: string
          minLength: 1
          maxLength: 4000
        locale:
          type: string
          enum:
            - en
            - es
          nullable: true
    FeedbackCreateResponse:
      type: object
      required:
        - id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    AskResponse:
      type: object
      required:
        - answer
        - language
        - sources
        - cache_hit
      properties:
        answer:
          type: string
        language:
          type: string
          enum:
            - en
            - es
        cache_hit:
          type: string
          description: >
            F43 H1 answer/retrieve cache observability (EV-017 / ADR-042).
            `none` = full generate path; `exact` / `semantic` skip LLM;
            `retrieve` reuses cached chunks then may still synthesize.
          enum:
            - none
            - exact
            - semantic
            - retrieve
          default: none
        energy_estimate:
          $ref: "#/components/schemas/EnergyEstimate"
        sources:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Source"
    HealthResponse:
      type: object
      required:
        - status
        - dependencies
      properties:
        status:
          type: string
          enum:
            - ok
        dependencies:
          type: object
          additionalProperties:
            type: string
          example:
            postgres: ok
            modal_embed: ok
            modal_llm: ok
    ErrorBody:
      type: object
      properties:
        detail:
          type: string
  responses:
    ValidationError:
      description: Validation or forbidden identity fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServiceUnavailable:
      description: Upstream dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Unknown document
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
