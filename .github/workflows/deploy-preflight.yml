# Pre-deploy gate on main — build smoke + Modal secrets (no live deploy).
# Triggered only after the full CI suite passes on main.
# Modal has no `deploy --dry-run`; verify_build.sh imports app modules instead.
name: Deploy preflight

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Do not cancel in-progress runs: rapid main pushes otherwise leave every run as
# "failure" with 0 jobs (agents only watched ci.yml and thought main was green).
concurrency:
  group: deploy-preflight-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Build smoke (uv sync + Modal app import)
        run: bash scripts/deploy/verify_build.sh

  modal-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-smoke
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    # secrets.* is not allowed in job-level `if` — detect tokens in a step instead.
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      VECINITA_INTERNAL_API_KEY: ${{ secrets.VECINITA_INTERNAL_API_KEY }}
      VECINITA_INTERNAL_WRITE_URL: ${{ secrets.VECINITA_INTERNAL_WRITE_URL }}
      VECINITA_AUTOMATIONS_KILL_SWITCH: ${{ secrets.VECINITA_AUTOMATIONS_KILL_SWITCH }}
      VECINITA_FINETUNE_ENABLED: ${{ secrets.VECINITA_FINETUNE_ENABLED }}
      VECINITA_FINETUNE_REQUIRE_APPROVE: ${{ secrets.VECINITA_FINETUNE_REQUIRE_APPROVE }}
      VECINITA_FINETUNE_MAX_CONCURRENT: ${{ secrets.VECINITA_FINETUNE_MAX_CONCURRENT }}
      VECINITA_FINETUNE_MAX_RUNS_PER_DAY: ${{ secrets.VECINITA_FINETUNE_MAX_RUNS_PER_DAY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2  # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Detect Modal GitHub secrets
        id: modal_tokens
        run: |
          if [ -z "${MODAL_TOKEN_ID}" ] || [ -z "${MODAL_TOKEN_SECRET}" ]; then
            echo "Modal GitHub secrets not configured — skipping verify_secrets.sh"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Modal CLI
        if: steps.modal_tokens.outputs.skip != 'true'
        run: pip install 'modal>=1.2.6,<2'

      - name: Materialize deploy env from GitHub secrets
        if: steps.modal_tokens.outputs.skip != 'true'
        run: bash scripts/deploy/ci_materialize_env.sh

      - name: Sync Modal vecinita-llm-finetune secret
        if: steps.modal_tokens.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if bash scripts/deploy/ci_materialize_env.sh --check finetune; then
            bash scripts/deploy/sync_finetune_secret.sh --apply
          else
            echo "::warning::Finetune secret env incomplete — skipping sync"
          fi

      - name: Verify Modal secrets and volumes
        if: steps.modal_tokens.outputs.skip != 'true'
        run: bash scripts/deploy/verify_secrets.sh
