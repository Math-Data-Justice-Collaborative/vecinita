# DigitalOcean App Platform — staging internal write API (F83 / ADR-054)
name: vecinita-staging-write-api
region: nyc
features:
  - buildpack-stack=ubuntu-22

services:
  - name: api
    github:
      repo: Math-Data-Justice-Collaborative/vecinita
      branch: main
      deploy_on_push: false
    source_dir: /
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    health_check:
      http_path: /health
    build_command: uv sync --group dev
    run_command: python3 -m uvicorn vecinita_internal_write_api.app:create_app --factory --host 0.0.0.0 --port 8080
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_INTERNAL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_ENV
        scope: RUN_TIME
        value: staging
      - key: VECINITA_CORS_ORIGINS
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_MODAL_DATA_MGMT_URL
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_MODAL_PROXY_KEY
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_MODAL_EMBED_URL
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_MODAL_LLM_URL
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_MODAL_LLM_PLAYGROUND_URL
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_CHAT_RAG_URL
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_CHAT_FRONTEND_URL
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_ADMIN_FRONTEND_URL
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_HEALTH_TIMEOUT_MS
        scope: RUN_TIME
        value: "5000"
      - key: VECINITA_AUDIT_RETENTION_DAYS
        scope: RUN_TIME
        value: "365"
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: VECINITA_AUTH_REQUIRED
        scope: RUN_TIME
        value: "true"
