# Create semver Git tag + GitHub Release after successful DigitalOcean CD on main.
# F63 / #103 / S025-D6 / S025-D12 — not a pre-merge gate.
name: Release

on:
  workflow_run:
    workflows: ["Deploy DigitalOcean"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Decide next tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          MSG="$(git log -1 --format=%B "$SHA")"
          mapfile -t ALL_TAGS < <(git tag -l 'v*' || true)
          mapfile -t HEAD_TAGS < <(git tag --points-at "$SHA" 'v*' || true)
          DECISION="$(uv run python scripts/ci/release_semver.py \
            --tags "${ALL_TAGS[@]+"${ALL_TAGS[@]}"}" \
            --head-tags "${HEAD_TAGS[@]+"${HEAD_TAGS[@]}"}" \
            --commit-message "$MSG")"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release decision: $DECISION (sha=$SHA)"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.decision != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.decision }}"
          SHA="${{ steps.version.outputs.sha }}"
          DO_RUN="${{ github.event.workflow_run.id || 'workflow_dispatch' }}"
          BODY="$(cat <<EOF
          Automated release after successful DigitalOcean deploy.

          - Commit: \`${SHA}\`
          - Deploy DigitalOcean run: https://github.com/${{ github.repository }}/actions/runs/${DO_RUN}
          - Triggering workflow: Release
          EOF
          )"
          git tag -a "$TAG" "$SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$BODY"
