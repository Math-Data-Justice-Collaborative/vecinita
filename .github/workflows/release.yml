# Create semver Git tag + GitHub Release after successful DigitalOcean CD on main.
# F63 / #103 / S025-D6 / S025-D12 — not a pre-merge gate.
#
# First-run note: a newly added workflow_run listener may miss the first upstream
# completion after landing on main — use workflow_dispatch once, or wait for the
# next Deploy DigitalOcean success.
name: Release

on:
  workflow_run:
    workflows: ["Deploy DigitalOcean"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Decide next tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          MSG="$(git log -1 --format=%B "$SHA")"
          mapfile -t ALL_TAGS < <(git tag -l 'v*' || true)
          mapfile -t HEAD_TAGS < <(git tag --points-at "$SHA" 'v*' || true)
          DECISION="$(uv run python scripts/ci/release_semver.py \
            --tags "${ALL_TAGS[@]+"${ALL_TAGS[@]}"}" \
            --head-tags "${HEAD_TAGS[@]+"${HEAD_TAGS[@]}"}" \
            --commit-message "$MSG")"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release decision: $DECISION (sha=$SHA)"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.decision != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.decision }}"
          SHA="${{ steps.version.outputs.sha }}"
          DO_RUN="${{ github.event.workflow_run.id || 'workflow_dispatch' }}"
          BODY="$(cat <<EOF
          Automated release after successful DigitalOcean deploy.

          - Commit: \`${SHA}\`
          - Deploy DigitalOcean run: https://github.com/${{ github.repository }}/actions/runs/${DO_RUN}
          - Triggering workflow: Release
          EOF
          )"
          # Annotated tags require a committer identity on the Actions runner.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes "$BODY"
