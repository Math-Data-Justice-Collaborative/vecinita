# Staging deploy + smoke for PRs targeting main (F83 / ADR-054).
# Required check name for branch ruleset: job ``staging-smoke`` (check name "staging-smoke").
#
# Prerequisites (GitHub Environment ``staging``):
#   DIGITALOCEAN_TOKEN, MODAL_TOKEN_ID, MODAL_TOKEN_SECRET (workspace vecinita),
#   DATABASE_URL (staging Postgres), staging Modal/DO URL secrets, SUPABASE_* staging.
#   Modal Environment ``staging`` must exist (web suffix ``staging``).
#
# Until Environment secrets exist, this workflow fails closed so merges stay blocked.
name: Deploy Staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  VECINITA_MODAL_WORKSPACE: vecinita
  MODAL_ENVIRONMENT: staging

jobs:
  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    outputs:
      chat_url: ${{ steps.urls.outputs.chat_url }}
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VECINITA_MODAL_EMBED_URL: ${{ secrets.VECINITA_MODAL_EMBED_URL }}
      VECINITA_MODAL_LLM_URL: ${{ secrets.VECINITA_MODAL_LLM_URL }}
      VECINITA_MODAL_LLM_PLAYGROUND_URL: ${{ secrets.VECINITA_MODAL_LLM_PLAYGROUND_URL }}
      VECINITA_MODAL_DATA_MGMT_URL: ${{ secrets.VECINITA_MODAL_DATA_MGMT_URL }}
      VECINITA_MODAL_PROXY_KEY: ${{ secrets.VECINITA_MODAL_PROXY_KEY }}
      VECINITA_INTERNAL_API_KEY: ${{ secrets.VECINITA_INTERNAL_API_KEY }}
      VECINITA_INTERNAL_WRITE_URL: ${{ secrets.VECINITA_INTERNAL_WRITE_URL }}
      VECINITA_CORS_ORIGINS: ${{ secrets.VECINITA_CORS_ORIGINS }}
      VITE_VECINITA_CHAT_API_URL: ${{ secrets.VITE_VECINITA_CHAT_API_URL }}
      VITE_VECINITA_ADMIN_API_URL: ${{ secrets.VITE_VECINITA_ADMIN_API_URL }}
      VITE_VECINITA_MODAL_PROXY_KEY: ${{ secrets.VITE_VECINITA_MODAL_PROXY_KEY }}
      VITE_VECINITA_CORPUS_API_URL: ${{ secrets.VITE_VECINITA_CORPUS_API_URL }}
      VITE_VECINITA_CORPUS_API_KEY: ${{ secrets.VITE_VECINITA_CORPUS_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Require staging Environment credentials
        run: |
          set -euo pipefail
          missing=0
          for key in DIGITALOCEAN_TOKEN MODAL_TOKEN_ID MODAL_TOKEN_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::${key} missing on GitHub Environment 'staging' (F83)." >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Create Environment 'staging' secrets, then re-run. See docs/staging-secrets-matrix.md." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Deploy Modal apps to Environment staging
        run: |
          set -euo pipefail
          export VECINITA_MODAL_WORKSPACE=vecinita
          export MODAL_ENVIRONMENT=staging
          bash scripts/deploy/modal.sh

      - name: Ensure staging DO apps exist
        run: |
          set -euo pipefail
          uv run --with pydo --with pyyaml scripts/deploy/do_apps.py create-all --env staging

      - name: Require mirrored-corpus embed URL (vecinita--)
        # EV-338 / BUG-2026-09-03 — prod→staging mirrored vectors need prod embed pin.
        # Waiver: set Environment variable VECINITA_ALLOW_STAGING_EMBED=1 only when
        # staging intentionally re-embeds under Modal Environment staging.
        env:
          VECINITA_ALLOW_STAGING_EMBED: ${{ vars.VECINITA_ALLOW_STAGING_EMBED || '' }}
        run: |
          set -euo pipefail
          bash scripts/deploy/check_staging_embed_mirror_align.sh

      - name: Sync staging DO secrets
        run: |
          set -euo pipefail
          uv run --with pydo --with pyyaml scripts/deploy/do_apps.py sync-all-secrets --env staging

      - name: Deploy staging DO apps
        run: |
          set -euo pipefail
          for app in \
            vecinita-staging-write-api \
            vecinita-staging-chat-api \
            vecinita-staging-chat-fe \
            vecinita-staging-admin-fe; do
            echo "==> Deploying ${app}"
            uv run --with pydo --with pyyaml scripts/deploy/do_apps.py deploy --name "${app}"
          done

      - name: Export staging URLs
        id: urls
        run: |
          set -euo pipefail
          uv run --with pydo --with pyyaml scripts/deploy/do_apps.py urls --env staging --frontend \
            | tee /tmp/staging-urls.env
          # shellcheck disable=SC1091
          set -a && source /tmp/staging-urls.env && set +a
          echo "chat_url=${VECINITA_STAGING_CHAT_URL:-}" >> "$GITHUB_OUTPUT"

  staging-smoke:
    name: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: deploy-staging
    environment: staging
    env:
      VECINITA_STAGING_CHAT_URL: ${{ needs.deploy-staging.outputs.chat_url }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Resolve staging chat URL
        run: |
          set -euo pipefail
          if [ -z "${VECINITA_STAGING_CHAT_URL:-}" ]; then
            uv run --with pydo --with pyyaml scripts/deploy/do_apps.py urls --env staging \
              | tee /tmp/staging-urls.env
            # shellcheck disable=SC1091
            set -a && source /tmp/staging-urls.env && set +a
            echo "VECINITA_STAGING_CHAT_URL=${VECINITA_STAGING_CHAT_URL}" >> "$GITHUB_ENV"
          fi
          if [ -z "${VECINITA_STAGING_CHAT_URL:-}" ]; then
            echo "::error::VECINITA_STAGING_CHAT_URL unset — staging apps missing?" >&2
            exit 1
          fi

      - name: Warm staging Modal (idle posture)
        env:
          VECINITA_MODAL_EMBED_URL: ${{ secrets.VECINITA_MODAL_EMBED_URL }}
          VECINITA_MODAL_LLM_URL: ${{ secrets.VECINITA_MODAL_LLM_URL }}
          VECINITA_MODAL_PROXY_KEY: ${{ secrets.VECINITA_MODAL_PROXY_KEY }}
        run: |
          set -euo pipefail
          # EV-354 / #354 / TC-326 / UJ-095 — scale-to-zero staging needs warm before H1–H3
          uv run python scripts/ops/warm_staging_for_smoke.py

      - name: H1–H3 staging smoke
        run: |
          set -euo pipefail
          uv run pytest tests/smoke/test_staging_health.py -m live -q --tb=short
