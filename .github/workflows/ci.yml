# Vecinita CI — per docs/test-plan.md §CI/CD (T13.1–T13.4)
name: CI

on:
  push:
    branches: [main, stage, "phase/**", "feat/**"]
  pull_request:
    branches: [main, stage, "phase/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vecinita
          POSTGRES_PASSWORD: vecinita
          POSTGRES_DB: vecinita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vecinita -d vecinita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://vecinita:vecinita@localhost:5432/vecinita
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: ADR-007 — no DATABASE_URL in Modal worker code
        run: bash scripts/check_modal_no_database_url.sh

      - name: OpenAPI specs present
        run: bash scripts/check_openapi_specs.sh

      - name: Install ripgrep (secret pattern scan)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Secret patterns (current tree)
        run: bash scripts/check_secrets.sh

      - name: Operator DO specs not tracked
        run: bash scripts/check_no_operator_specs_tracked.sh

      - name: Supabase config (invite-only auth)
        run: bash scripts/check_supabase_config.sh

      - name: Corpus reset guard (Managed Postgres)
        run: bash scripts/check_corpus_reset_guard.sh

      - name: DO Modal URL secrets in specs
        run: bash scripts/check_do_required_secrets.sh

      - name: Install gitleaks
        run: |
          # Retry GitHub Releases downloads (transient 503 / connection drops).
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz"
          out="/tmp/gitleaks.tgz"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 --retry-delay 2 --retry-all-errors \
              -o "${out}" "${url}"; then
              break
            fi
            echo "gitleaks download attempt ${attempt}/5 failed; retrying..."
            sleep $((attempt * 2))
            if [[ "${attempt}" -eq 5 ]]; then
              echo "gitleaks download failed after 5 attempts"
              exit 1
            fi
          done
          tar xz -C /tmp -f "${out}"
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks (current tree only)
        run: gitleaks detect --no-git --config .gitleaks.toml

      - name: Ruff lint
        run: uv run ruff check apps packages tests infra scripts

      - name: Ruff format
        run: uv run ruff format --check apps packages tests infra scripts

      - name: Basedpyright
        run: uv run basedpyright apps packages tests infra scripts

      - name: Apply database migrations
        working-directory: apps/database
        run: uv run alembic upgrade head

      # S027-D34: remote CI = unit only. Compose-backed integration/e2e/privacy/smoke/eval/bugs
      # run via local `make test-py` / `make ci-push` before opening a PR.
      - name: Pytest (unit)
        run: uv run pytest tests/unit

      - name: pip-audit (blocking)
        run: |
          IGNORE_ARGS=()
          while read -r cve; do
            [[ -z "$cve" || "$cve" =~ ^# ]] && continue
            IGNORE_ARGS+=(--ignore-vuln "$cve")
          done < audit/pip-audit-ignore.txt
          uv run pip-audit "${IGNORE_ARGS[@]}"

  rag-regression:
    name: rag-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vecinita
          POSTGRES_PASSWORD: vecinita
          POSTGRES_DB: vecinita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vecinita -d vecinita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://vecinita:vecinita@localhost:5432/vecinita
      VECINITA_RAG_MULTI_QUERY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Apply database migrations
        working-directory: apps/database
        run: uv run alembic upgrade head

      - name: ChatRAG golden regression gate (TC-280)
        run: uv run pytest tests/eval/test_rag_regression_gate.py -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Exact dependency pins
        run: python3 scripts/ci/check_exact_pins.py

      - name: Install security scanners
        run: SEC_TOOLS_DIR="${GITHUB_WORKSPACE}/.tools/security" bash scripts/security/install-tools.sh

      - name: Remediate Supabase advisor findings (live)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_CLI_VERSION: "2.84.2"
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "SUPABASE_ACCESS_TOKEN unset — skipping live advisor remediation"
            exit 0
          fi
          # CLI fallback for SQL when Management API query endpoint rejects the statement.
          curl -fsSL "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin supabase
          supabase --version
          bash scripts/security/remediate-supabase-advisors.sh

      - name: Security static analysis (hard-fail)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          SEC_TOOLS_DIR: ${{ github.workspace }}/.tools/security
          SEC_FAIL_FAST: "1"
          SEC_KICS_FAIL_ON: medium,high,critical
          SEC_GRYPE_FAIL_ON: high
          # Fail on WARN+ so advisor remediations stay enforced (INFO remains non-blocking).
          SEC_SUPABASE_ADVISOR_FAIL_ON: warn
          # Skip advisors only when the token secret is unset in the fork/PR context.
          SEC_SKIP_SUPABASE_ADVISORS: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' && '1' || '0' }}
        run: bash scripts/security/run-all.sh

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: security-reports
          path: .security-reports/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Publish Supabase advisor summary
        if: always()
        run: |
          if [[ -f .security-reports/supabase-advisors/summary.json ]]; then
            echo "## Supabase advisors" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path(".security-reports/supabase-advisors/summary.json").read_text())
          print(f"- total: **{s.get('total')}**")
          print(f"- blocking (fail_on={s.get('fail_on')}): **{s.get('blocking')}**")
          print(f"- by level: `{s.get('by_level')}`")
          for kind in ("security", "performance"):
              p = Path(f".security-reports/supabase-advisors/{kind}.json")
              if not p.exists():
                  continue
              data = json.loads(p.read_text())
              items = data.get("lints", data) if isinstance(data, dict) else data
              print(f"\n### {kind}")
              for lint in items or []:
                  name = lint.get("name") or lint.get("title") or "?"
                  print(f"- **[{lint.get('level')}]** `{name}` — {(lint.get('detail') or lint.get('description') or '')[:240]}")
          PY
          else
            echo "No supabase advisor summary found" >> "$GITHUB_STEP_SUMMARY"
          fi

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vecinita
          POSTGRES_PASSWORD: vecinita
          POSTGRES_DB: vecinita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vecinita -d vecinita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://vecinita:vecinita@localhost:5432/vecinita
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect coverage-relevant changes
        id: coverage_changes
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps|packages|tests/unit)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping coverage job — no apps/packages/tests/unit changes"
          fi

      - name: Install uv
        if: steps.coverage_changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Python 3.11
        if: steps.coverage_changes.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        if: steps.coverage_changes.outputs.run == 'true'
        run: uv sync --group dev

      - name: Apply database migrations
        if: steps.coverage_changes.outputs.run == 'true'
        working-directory: apps/database
        run: uv run alembic upgrade head

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: steps.coverage_changes.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        if: steps.coverage_changes.outputs.run == 'true'
        working-directory: .
        run: npm ci

      - name: Unit coverage gate (F31 / ADR-019)
        if: steps.coverage_changes.outputs.run == 'true'
        run: make test-unit-coverage

      - name: Write coverage PR markdown
        if: >-
          steps.coverage_changes.outputs.run == 'true' &&
          github.event_name == 'pull_request'
        run: |
          uv run python scripts/test/print_unit_coverage_summary.py \
            --markdown-out coverage/pr-comment.md

      - name: Comment unit coverage on PR (S027-D34)
        if: >-
          steps.coverage_changes.outputs.run == 'true' &&
          github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: bash scripts/ci/comment_unit_coverage_pr.sh coverage/pr-comment.md

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app:
          - chat-rag-frontend
          - data-management-frontend
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        working-directory: .
        run: npm ci

      - name: Install and verify
        working-directory: apps/${{ matrix.app }}
        run: |
          npm run lint
          npm test
          npm run build

  packages:
    # QA-010 / ADR-019 / ADR-020 — shared frontend packages have their own
    # tests that the per-app `frontend` matrix does not cover.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package:
          - vecinita-frontend-i18n
          - vecinita-frontend-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint, typecheck, and test
        run: |
          npm run lint -w ${{ matrix.package }}
          npm run typecheck -w ${{ matrix.package }}
          npm test -w ${{ matrix.package }}

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Playwright UI E2E (T0-ui)
        run: bash scripts/ui/run_playwright.sh

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python, rag-regression, coverage, frontend, packages, ui-e2e, security]
    if: >-
      ${{ always() &&
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled') }}
    steps:
      - name: All required CI jobs passed
        run: echo "CI gate passed for ${{ github.sha }}"
