[project]
name = "vecinita-rerank-client"
version = "0.1.0"
description = "HTTP client for Modal cross-encoder rerank service (F45)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "vecinita-shared-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vecinita_rerank_client"]

[tool.uv.sources]
vecinita-shared-schemas = { workspace = true }
