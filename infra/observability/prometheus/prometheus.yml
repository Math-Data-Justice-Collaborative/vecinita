# Prometheus scrape + rule files for staging obs (F84).

global:
  scrape_interval: 60s
  evaluation_interval: 60s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Staging DO App Platform health probes (F84).
  - job_name: do-internal-write-api
    metrics_path: /health
    scheme: https
    static_configs:
      - targets: ["vecinita-staging-write-api-w7eol.ondigitalocean.app"]
        labels:
          service: internal-write-api
          env: staging

  - job_name: do-chat-rag
    metrics_path: /health
    scheme: https
    static_configs:
      - targets: ["vecinita-staging-chat-api-tobwu.ondigitalocean.app"]
        labels:
          service: chat-rag
          env: staging

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
