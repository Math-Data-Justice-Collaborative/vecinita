# Ops recovery: stop Modal apps to clear saturated pending-input queues, then redeploy.
# Use when embed/rerank return HTTP 429 "pending input queue limit (2000)".
name: Modal drain + redeploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-modal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain-redeploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Require Modal tokens
        run: |
          if [ -z "${MODAL_TOKEN_ID}" ] || [ -z "${MODAL_TOKEN_SECRET}" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET not set." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: pip install 'modal>=1.2.6,<2'

      - name: Build smoke (uv sync + Modal app import)
        run: bash scripts/deploy/verify_build.sh

      - name: Stop apps to clear pending input queues
        run: |
          set -euo pipefail
          # Stop ASGI entrypoints that can accumulate remote() backlog (#275).
          for app in vecinita-embedding vecinita-rerank vecinita-data-management; do
            echo "==> modal app stop ${app}"
            # Non-interactive CI requires -y (otherwise stop aborts and queue stays full).
            modal app stop --yes "$app" || echo "WARN: stop ${app} failed (continuing)"
          done
          sleep 20

      - name: Redeploy Modal apps
        run: bash scripts/deploy/modal.sh

      - name: List deployed apps
        run: modal app list
