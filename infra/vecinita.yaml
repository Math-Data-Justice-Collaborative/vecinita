# Local/staging non-secret defaults (config-spec.md §Configuration files).
# Production secrets remain on DO/Modal platforms — not in this file.

env: development

chat_rag:
  top_k: 8
  rag_packer: p3
  rag_context_max_chars: 3500
  request_timeout_s: 60
  # F65 / ADR-047 — heuristic energy knobs (env VECINITA_ENERGY_* overrides)
  energy_gpu_tdp_w: 70
  energy_gpu_util: 0.5
  energy_gco2e_per_kwh: 386
  energy_car_gco2e_per_km: 251

feedback:
  # F68 / ADR-046 — purge horizon (env VECINITA_FEEDBACK_RETENTION_DAYS)
  retention_days: 90

ingest:
  chunk_size_tokens: 256
  scrape_timeout_s: 30
  scrape_user_agent: "VecinitaBot/1.0 (+https://github.com/Math-Data-Justice-Collaborative/vecinita)"
  scrape_rate_limit_rps: 0.5
  scrape_respect_robots: true
  crawl_max_depth: 2
  crawl_max_pages: 25
  scrape_js_render: auto
  scrape_pdf_enabled: true

services:
  chat_rag_backend: http://localhost:8000
  internal_write_api: http://localhost:8002
  data_management_modal: http://localhost:8001
  chat_rag_frontend: http://localhost:5173
  data_management_frontend: http://localhost:5174
  modal_embed: http://localhost:8003
  modal_llm: http://localhost:8004
